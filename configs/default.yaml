{
  "project": {
    "name": "CodeFixer",
    "seed": 7
  },
  "paths": {
    "tasks_file": "configs/tasks_toy.yaml",
    "logs_dir": "outputs/evaluation/logs",
    "workspaces_dir": "outputs/evaluation/workspaces",
    "results_file": "outputs/evaluation/results.json",
    "summary_file": "outputs/evaluation/summary.md",
    "trajectory_file": "outputs/evaluation/trajectory.jsonl",
    "replay_file": "outputs/evaluation/replay_buffer.jsonl",
    "training_output_dir": "outputs/evaluation/training"
  },
  "agent": {
    "max_steps": 6,
    "use_memory": true,
    "use_test_feedback": true,
    "use_self_evolution": true
  },
  "orchestrator": {
    "mode": "single_agent"
  },
  "policy": {
    "type": "rule_based"
  },
  "llm": {
    "provider": "openai",
    "model": "gpt-4.1-mini",
    "max_tokens": 800,
    "temperature": 0.0,
    "api_key_env": "OPENAI_API_KEY",
    "endpoint": "https://api.openai.com/v1/chat/completions"
  },
  "environment": {
    "test_timeout_sec": 20,
    "allowed_edit_globs": ["*.py"],
    "unsafe_edit_globs": ["test_*.py"]
  },
  "evaluation": {
    "system_version": "feedback",
    "systems": ["baseline", "feedback", "learning"],
    "output_dir": "outputs/evaluation",
    "pass_at_k": 3,
    "trials_per_task": 3,
    "cost_per_tool_call": 0.001,
    "record_reward_breakdown": true,
    "run_hidden_tests": true
  },
  "training": {
    "guidance": {
      "enabled": true
    }
  },
  "evolution": {
    "export_sft": true,
    "export_dpo_opd": true,
    "export_rwr": true,
    "export_rlvr": true,
    "export_guidance": true
  }
}
